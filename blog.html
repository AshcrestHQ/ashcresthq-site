<!-- Dynamic GitHub Fetch Script -->
<script>
async function fetchGithubUpdates() {
    try {
        // Here you would typically connect to a Vercel Serverless Function 
        // that handles the webhook payloads from GitHub and stores them.
        // For demonstration purposes on a static site, we fetch public events directly from the repo.
        
        // Use your organization and repository name
        const res = await fetch(`https://api.github.com/users/AshcrestHQ/events`);
        
        if (!res.ok) {
            throw new Error(`GitHub API returned ${res.status}`);
        }
        
        const events = await res.json();
        const container = document.getElementById('github-updates');
        container.innerHTML = '';
        
        // Filter for push events, pull requests, or issues
        const relevantEvents = events.filter(e => ['PushEvent', 'PullRequestEvent', 'IssuesEvent'].includes(e.type)).slice(0, 10);
        
        if (relevantEvents.length === 0) {
            container.innerHTML = '<div class="text-on-surface-variant text-center py-lg">No recent updates found.</div>';
            return;
        }

        relevantEvents.forEach(event => {
            const date = new Date(event.created_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
            let title = '';
            let description = '';
            let tag = '';
            
            if (event.type === 'PushEvent') {
                tag = 'Commit';
                title = `Pushed to ${event.payload.ref.replace('refs/heads/', '')}`;
                description = event.payload.commits.map(c => c.message).join('<br/>');
            } else if (event.type === 'PullRequestEvent') {
                tag = 'Pull Request';
                title = `${event.payload.action} PR #${event.payload.pull_request.number}: ${event.payload.pull_request.title}`;
                description = event.payload.pull_request.body || 'No description provided.';
            } else if (event.type === 'IssuesEvent') {
                tag = 'Issue';
                title = `${event.payload.action} issue #${event.payload.issue.number}: ${event.payload.issue.title}`;
                description = event.payload.issue.body || 'No description provided.';
            }
            
            const card = `
                <article class="surface border border-subtle rounded-lg p-md flex flex-col group glow-amber transition-shadow cursor-pointer relative">
                    <div class="flex items-center justify-between mb-sm">
                        <div class="flex items-center gap-xs">
                            <span class="bg-secondary-container/15 text-secondary font-code-sm text-code-sm px-2 py-1 rounded uppercase text-[10px]">${tag}</span>
                            <span class="text-on-surface-variant font-code-sm text-code-sm text-[10px]">${date}</span>
                        </div>
                        <span class="text-on-surface-variant font-code-sm text-[10px]">by ${event.actor.login}</span>
                    </div>
                    <h3 class="font-headline-lg-mobile text-headline-lg-mobile mb-xs group-hover:text-primary transition-colors">${title}</h3>
                    <p class="text-on-surface-variant text-sm line-clamp-3">${description}</p>
                </article>
            `;
            container.innerHTML += card;
        });
        
    } catch (e) {
        console.error("Failed to fetch Github updates", e);
        document.getElementById('github-updates').innerHTML = '<div class="text-error text-center py-lg">Error loading updates from GitHub. Check console for details.</div>';
    }
}

</script>
